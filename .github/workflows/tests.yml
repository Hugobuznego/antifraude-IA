name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest -v

      # GitHub no puede descargar PaySim, asi que comprobamos que el script de
      # entrenamiento funciona de punta a punta con datos sinteticos
      - name: Entrenamiento de prueba
        run: python -m fraude.train --synthetic 100000 --out artifacts
